<header class="hdr">
  <div class="wrap">
    <div class="hdr-inner">
      <a class="logo" routerLink="/" [attr.aria-label]="brand.name + ', inicio'" (click)="ui.closeMobileMenu()">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="14.5" stroke="#18202C" stroke-width="1" />
          <circle cx="16" cy="16" r="6" style="fill: var(--acc)" />
          <circle cx="24.5" cy="9" r="2.4" style="fill: var(--acc2)" />
          <path d="M20.5 12.5l2.4-2" stroke="#18202C" stroke-width="1" />
        </svg>
        <span class="logo__text">{{ brand.logoPrimary }}<span>{{ brand.logoSecondary }}</span></span>
      </a>

      <nav class="nav" aria-label="Principal">
        @for (link of links; track link.label) {
          <a [routerLink]="link.path" [fragment]="link.fragment">{{ link.label }}</a>
        }
      </nav>

      <div class="actions">
        <a class="icb icb--ghost" routerLink="/favoritos" [attr.aria-label]="'Favoritos, ' + favorites.count() + ' guardados'">
          <app-icon name="heart" [filled]="favorites.count() > 0" />
          @if (favorites.count()) {
            <span class="dot-count">{{ favorites.count() }}</span>
          }
        </a>
        <button
          type="button"
          class="cart-btn"
          aria-haspopup="dialog"
          [attr.aria-label]="'Ver tu selección, ' + selection.itemCount() + ' fragancias'"
          (click)="ui.openSelectionDrawer()"
        >
          <span class="cart-btn__label">Selección</span>
          <span class="cart-btn__count" [appReplayAnimation]="selection.lastChange()">{{ selection.itemCount() }}</span>
        </button>
        <button
          type="button"
          class="icb icb--ghost menu-btn"
          aria-controls="mobile-nav"
          [attr.aria-expanded]="ui.mobileMenuOpen()"
          [attr.aria-label]="ui.mobileMenuOpen() ? 'Cerrar menú' : 'Abrir menú'"
          (click)="ui.toggleMobileMenu()"
        >
          <app-icon [name]="ui.mobileMenuOpen() ? 'close' : 'menu'" />
        </button>
      </div>
    </div>

    <nav
      id="mobile-nav"
      class="mnav"
      aria-label="Menú"
      [class.open]="ui.mobileMenuOpen()"
      [attr.inert]="ui.mobileMenuOpen() ? null : ''"
      [appBodyScrollLock]="ui.mobileMenuOpen()"
    >
      @for (link of links; track link.label) {
        <a class="serif" [routerLink]="link.path" [fragment]="link.fragment" (click)="ui.closeMobileMenu()">{{ link.label }}</a>
      }
      <a class="serif" routerLink="/favoritos" (click)="ui.closeMobileMenu()">Favoritos</a>
    </nav>
  </div>
</header>
